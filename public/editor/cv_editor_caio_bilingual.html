<title>CV Editor — Caio Valerio Goulart Correia</title>
<style>
:root {
  --bg: #ffffff;
  --text: #24292e;
  --muted: #586069;
  --accent: #0366d6;
  --border: #eaecef;
  --btn-bg: #f6f8fa;
  --toolbar: #0d1117;
  --toolbar-text: #f0f6fc;
  --danger: #cf222e;
  --ok: #1a7f37;
  --panel: #f6f8fa;
  --edit-outline: rgba(3,102,214,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color: var(--text);
  background: #eef1f5;
  line-height: 1.55;
}
#toolbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--toolbar); color: var(--toolbar-text);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid #30363d;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
#toolbar .brand { font-weight: 700; margin-right: 8px; font-size: 14px; letter-spacing: .2px; }
#toolbar .sep { width: 1px; height: 22px; background: #30363d; margin: 0 4px; }
#toolbar button, #toolbar label.file-btn {
  background: #21262d; color: var(--toolbar-text);
  border: 1px solid #30363d; border-radius: 6px;
  padding: 6px 10px; font-size: 12px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
}
#toolbar button:hover, #toolbar label.file-btn:hover { background: #30363d; }
#toolbar button.active { background: var(--accent); border-color: var(--accent); }
#toolbar button.danger { background: #3d1215; border-color: #8b1e26; }
#toolbar button.ok { background: #0f3d1f; border-color: #1a7f37; }
#toolbar .status { margin-left: auto; font-size: 12px; color: #8b949e; }
#toolbar input[type=file] { display: none; }
.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 0;
  min-height: calc(100vh - 48px);
}
.layout.preview-only { grid-template-columns: 1fr; }
.layout.preview-only #side-panel { display: none; }
#side-panel {
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  max-height: calc(100vh - 48px);
  position: sticky; top: 48px;
}
#side-panel h4 {
  margin: 18px 0 8px; font-size: 12px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted);
}
#side-panel h4:first-child { margin-top: 0; }
#side-panel .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 7px 9px; border: 1px solid var(--border);
  border-radius: 6px; font: inherit; font-size: 13px; background: #fff;
}
.field textarea { min-height: 72px; resize: vertical; }
.item-card {
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; margin-bottom: 10px;
}
.item-card .row-actions { display: flex; gap: 6px; margin-top: 8px; }
.item-card button {
  font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--border); background: var(--btn-bg);
}
.item-card button.rm { color: var(--danger); }
.add-btn {
  width: 100%; padding: 8px; border: 1px dashed var(--accent); color: var(--accent);
  background: #fff; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
}
.add-btn:hover { background: #eef5ff; }
#resume-wrap {
  padding: 24px 16px 60px;
  display: flex; justify-content: center;
}
#resume {
  width: 100%; max-width: 850px;
  background: var(--bg); color: var(--text);
  padding: 36px 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,.06);
}
#resume a { color: var(--accent); text-decoration: none; }
#resume a:hover { text-decoration: underline; }
#resume header { margin-bottom: 24px; }
#resume h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -.5px; }
#resume .headline { font-size: 17px; color: var(--muted); font-weight: 400; margin: 0 0 12px; }
#resume .contact { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
#resume .summary { font-size: 14px; margin-bottom: 22px; }
#resume h3 {
  font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
  border-bottom: 1px solid var(--border); padding-bottom: 6px;
  margin: 28px 0 14px;

  break-after: avoid;
  page-break-after: avoid;
}
.job {
  margin-bottom: 18px;
  break-inside: avoid;
  page-break-inside: avoid;
}
.job-header {
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: 12px;
  align-items: baseline;
  width: 100%;
  margin-bottom: 6px;
  break-inside: avoid;
  page-break-inside: avoid;
  break-after: avoid;
  page-break-after: avoid;
}
.job-title {
  font-weight: 600;
  font-size: 15px;
  text-align: left;
  min-width: 0;
}
.job-meta {
  font-size: 13px;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}
.job-details { margin: 0; padding-left: 18px; font-size: 13.5px; }
.job-details li { margin-bottom: 6px; }
.skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 13.5px; }
.skill-category strong { display: block; margin-bottom: 4px; }
.skill-category p { margin: 0; color: var(--muted); }
body.edit-mode #resume [contenteditable="true"] {
  outline: 1px dashed var(--edit-outline);
  border-radius: 3px; min-height: 1em;
}
body.edit-mode #resume [contenteditable="true"]:focus {
  outline: 2px solid var(--accent); background: #f0f7ff;
}
.inline-rm {
  display: none; margin-left: 8px; font-size: 11px; color: var(--danger);
  border: 1px solid #ffd7d5; background: #ffebe9; border-radius: 4px;
  padding: 1px 6px; cursor: pointer; vertical-align: middle;
}
body.edit-mode .inline-rm { display: inline-block; }
.toast {
  position: fixed; bottom: 18px; right: 18px; background: #0d1117; color: #fff;
  padding: 10px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
  pointer-events: none; transition: opacity .25s; z-index: 200;
}
.toast.show { opacity: 1; }
@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  #side-panel { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
  .skills-grid { grid-template-columns: 1fr; }
  body:not(.pdf-exporting) .job-header {
    display: block;
    width: 100%;
  }
  body:not(.pdf-exporting) .job-title,
  body:not(.pdf-exporting) .job-meta {
    display: block;
    width: 100%;
    text-align: left;
  }
  body:not(.pdf-exporting) .job-meta { margin-top: 2px; white-space: normal; }
}
body.pdf-exporting #toolbar,
body.pdf-exporting #side-panel,
body.pdf-exporting .inline-rm { display: none !important; }
body.pdf-exporting .layout { display: block !important; grid-template-columns: 1fr; margin: 0 !important; padding: 0 !important; }
body.pdf-exporting #resume-wrap { padding: 0 !important; margin: 0 !important; }
body.pdf-exporting { background: #fff !important; }
body.pdf-exporting #resume {
  box-shadow: none !important; border: none !important; border-radius: 0 !important;
  max-width: 700px !important; width: 700px !important;
  margin: 0 auto !important; padding: 24px 28px !important;
}
body.pdf-exporting .job-header {
  display: grid !important;
  grid-template-columns: 1fr auto !important;
  column-gap: 12px !important;
  align-items: baseline !important;
  width: 100% !important;
  overflow: visible !important;
}
body.pdf-exporting .job-title {
  text-align: left !important; min-width: 0 !important;
  float: none !important; max-width: none !important;
}
body.pdf-exporting .job-meta {
  text-align: right !important; white-space: nowrap !important;
  float: none !important; max-width: none !important;
}
body.pdf-exporting .job {
  break-inside: avoid !important;
  page-break-inside: avoid !important;
}
body.pdf-exporting #resume h3,
body.pdf-exporting .job-header {
  break-inside: avoid !important;
  page-break-inside: avoid !important;
  break-after: avoid !important;
  page-break-after: avoid !important;
}
/* Allow long sections to span pages; keep each job atomic */
body.pdf-exporting section {
  break-inside: auto;
  page-break-inside: auto;
}
tr, .skill-category, .job-header { break-inside: avoid; page-break-inside: avoid; }

@media print {
  @page { size: A4; margin: 1.4cm 1.1cm; }
  #toolbar, #side-panel, .toast, .inline-rm { display: none !important; }
  .layout { display: block; }
  body { background: #fff; }
  #resume-wrap { padding: 0; }
  #resume {
    box-shadow: none; border: none; border-radius: 0;
    max-width: 100%; padding: 0; margin: 0;
  }
  .job, tr, .skill-category { break-inside: avoid; page-break-inside: avoid; }
  #resume h3, .job-header {
    break-inside: avoid; page-break-inside: avoid;
    break-after: avoid; page-break-after: avoid;
  }
  section { break-inside: auto; page-break-inside: auto; }
  a { color: #000 !important; text-decoration: none !important; }
}
</style>
</head>
<body class="edit-mode">

<div id="toolbar">
  <span class="brand">CV Creator · Caio</span>
  <div class="sep"></div>

  <div class="sep"></div>
  <button type="button" id="btn-en" class="active" onclick="setLang('en')">EN</button>
  <button type="button" id="btn-pt" onclick="setLang('pt')">PT</button>
  <div class="sep"></div>
  <button type="button" class="ok" onclick="saveLocal()">💾 Save</button>
  <button type="button" onclick="exportJSON()">⬇ Export JSON</button>
  <button type="button" onclick="exportHTML()">⬇ Export HTML</button>
  <label class="file-btn">⬆ Import JSON<input type="file" id="import-file" accept="application/json,.json" onchange="importJSON(event)"></label>
  <button type="button" class="danger" onclick="resetCV()">↺ Reset</button>
  <span class="status" id="status">Ready</span>
</div>

<div class="layout" id="layout">
  <aside id="side-panel">
    <h4>Header</h4>
    <p class="hint">Edits sync to the live resume. Content is also editable inline on the page.</p>
    <div class="field"><label>Name</label><input id="f-name" data-path="name"></div>
    <div class="field"><label>Headline (EN)</label><input id="f-headline-en" data-path="headline.en"></div>
    <div class="field"><label>Headline (PT)</label><input id="f-headline-pt" data-path="headline.pt"></div>
    <div class="field"><label>Location (EN)</label><input id="f-loc-en" data-path="location.en"></div>
    <div class="field"><label>Location (PT)</label><input id="f-loc-pt" data-path="location.pt"></div>

    <div class="field"><label>LinkedIn URL</label><input id="f-linkedin" data-path="linkedin"></div>

    <h4>Summary</h4>
    <div class="field"><label>EN</label><textarea id="f-sum-en" data-path="summary.en"></textarea></div>
    <div class="field"><label>PT</label><textarea id="f-sum-pt" data-path="summary.pt"></textarea></div>

    <h4>Experience</h4>
    <div id="exp-editor"></div>
    <button type="button" class="add-btn" onclick="addExperience()">+ Add experience</button>

    <h4>Projects</h4>
    <div id="proj-editor"></div>
    <button type="button" class="add-btn" onclick="addProject()">+ Add project</button>

    <h4>Skills</h4>
    <div id="skills-editor"></div>
    <button type="button" class="add-btn" onclick="addSkill()">+ Add skill category</button>

    <h4>Education</h4>
    <div id="edu-editor"></div>
    <button type="button" class="add-btn" onclick="addEducation()">+ Add education</button>

    <h4>Languages line</h4>
    <div class="field"><label>EN</label><textarea id="f-lang-en" data-path="languages.en"></textarea></div>
    <div class="field"><label>PT</label><textarea id="f-lang-pt" data-path="languages.pt"></textarea></div>
  </aside>

  <div id="resume-wrap">
    <article id="resume" aria-label="Resume preview"></article>
  </div>
</div>

<div class="toast" id="toast"></div>

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function setStatus(msg){ document.getElementById('status').textContent = msg; }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function githubLabel(url){
  try { return url.replace(/^https?:\/\//,'').replace(/\/$/,''); } catch(e){ return url; }
}

function getByPath(obj, path){
  return path.split('.').reduce((a,k)=> (a==null? a : a[k]), obj);
}
function setByPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for (let i=0;i<parts.length-1;i++){
    if (cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length-1]] = value;
}

function bindPanelInputs(){
  document.querySelectorAll('[data-path]').forEach(el=>{
    el.oninput = () => {
      setByPath(cv, el.dataset.path, el.value);
      scheduleSave();
      renderResume();
    };
  });
}

function fillPanelScalars(){
  suppressPanelSync = true;
  document.querySelectorAll('[data-path]').forEach(el=>{
    const v = getByPath(cv, el.dataset.path);
    el.value = v == null ? '' : String(v).replace(/<\/?strong>/g,'');
  });
  // keep HTML for languages fields
  document.getElementById('f-lang-en').value = cv.languages.en;
  document.getElementById('f-lang-pt').value = cv.languages.pt;
  suppressPanelSync = false;
}

  if (!confirm('Remove this item?')) return;
  cv[key].splice(i,1);
  scheduleSave(); renderAll(); toast('Removed');
}
function moveItem(key, i, dir){
  const j = i + dir;
  if (j < 0 || j >= cv[key].length) return;
  const tmp = cv[key][i]; cv[key][i] = cv[key][j]; cv[key][j] = tmp;
  scheduleSave(); renderAll();
}

function ce(attr, html){
  if (mode !== 'edit') return html;
  return `<span contenteditable="true" data-bind="${attr}" spellcheck="true">${html}</span>`;
}

function renderResume(){
  const t = T[lang];
  const L = lang;
  const gh = githubLabel(cv.github);
  const li = githubLabel(cv.linkedin);

  const jobs = cv.experience.map((job,i)=>{
    const bullets = (job.bullets[L]||[]).map((b,bi)=>`<li>${ce(`experience.${i}.bullets.${L}.${bi}`, esc(b))}</li>`).join('');
    return `<div class="job">
      <div class="job-header">
        <span class="job-title">${ce(`experience.${i}.title.${L}`, esc(job.title[L]))}</span>
        <span class="job-meta">${ce(`experience.${i}.meta.${L}`, esc(job.meta[L]))}
<button type="button" class="inline-rm" onclick="removeItem('experience',${i})">X</button></span>
      </div>
      <ul class="job-details">${bullets}</ul>
    </div>`;
  }).join('');

  const projects = cv.projects.map((p,i)=>{
    const links = [];
    if (p.live) links.push(`<strong>${t.live}:</strong> <a href="${esc(p.live)}" target="_blank">${esc(githubLabel(p.live))}</a>`);
    if (p.repo) links.push(`<strong>${t.repo}:</strong> <a href="${esc(p.repo)}" target="_blank">${esc(githubLabel(p.repo))}</a>`);
    const linkLi = links.length ? `<li>${links.join(' · ')}</li>` : '';
    const bullets = (p.bullets[L]||[]).map((b,bi)=>`<li>${ce(`projects.${i}.bullets.${L}.${bi}`, esc(b))}</li>`).join('');
    return `<div class="job">
      <div class="job-header">
        <span class="job-title">${ce(`projects.${i}.title.${L}`, esc(p.title[L]))}</span>
        <span class="job-meta">${ce(`projects.${i}.meta.${L}`, esc(p.meta[L]))}
<button type="button" class="inline-rm" onclick="removeItem('projects',${i})">X</button></span>
      </div>
      <ul class="job-details">${linkLi}${bullets}</ul>
    </div>`;
  }).join('');

  const skills = cv.skills.map((s,i)=>`
    <div class="skill-category">
      <strong>${ce(`skills.${i}.cat.${L}`, esc(s.cat[L]))}</strong>
      <p>${ce(`skills.${i}.items.${L}`, esc(s.items[L]))}</p>
    </div>`).join('');

  const edu = cv.education.map((e,i)=>`
    <div class="job">
      <div class="job-header">
        <span class="job-title">${ce(`education.${i}.title.${L}`, esc(e.title[L]))}</span>
        <span class="job-meta">${ce(`education.${i}.meta.${L}`, esc(e.meta[L]))}<button type="button" class="inline-rm" onclick="removeItem('education',${i})">X</button></span>
      </div>
    </div>`).join('');

  document.getElementById('resume').innerHTML = `
    <header>
      <h1>${ce('name', esc(cv.name))}</h1>
      <p class="headline">${ce(`headline.${L}`, esc(cv.headline[L]))}</p>
      <div class="contact">
        <span>${ce(`location.${L}`, esc(cv.location[L]))}</span>
        <span><a href="mailto:${esc(cv.email)}">${ce('email', esc(cv.email))}</a></span>
        <span>${ce('phone', esc(cv.phone))}</span>
        <span><a href="${esc(cv.github)}" target="_blank">${esc(gh)}</a></span>
        <span><a href="${esc(cv.linkedin)}" target="_blank">${esc(li)}</a></span>
      </div>
    </header>
    <div class="summary"><p>${ce(`summary.${L}`, esc(cv.summary[L]))}</p></div>
    <section><h3>${t.exp}</h3>${jobs}</section>
    <section><h3>${t.projects}</h3>${projects}</section>
    <section><h3>${t.skills}</h3><div class="skills-grid">${skills}</div></section>
    <section><h3>${t.edu}</h3>${edu}</section>
    <section><h3>${t.langs}</h3><div class="skill-category"><p>${ce(`languages.${L}`, cv.languages[L])}</p></div></section>
  `;

  if (mode === 'edit') {
    document.querySelectorAll('#resume [contenteditable]').forEach(el=>{
      el.addEventListener('input', () => {
        const path = el.dataset.bind;
        // languages may contain HTML strong tags — allow HTML
        if (path.startsWith('languages.')) setByPath(cv, path, el.innerHTML);
        else setByPath(cv, path, el.innerText);
        scheduleSave();
        // sync scalar panel fields without rebuilding editors (preserve focus)
        syncScalarPanelFromCV();
      });
      el.addEventListener('blur', () => {
        // rebuild panel editors on blur so list editors stay consistent
        fillPanelScalars();
      });
    });
  }
}

function syncScalarPanelFromCV(){
  document.querySelectorAll('[data-path]').forEach(el=>{
    if (document.activeElement === el) return;
    const v = getByPath(cv, el.dataset.path);
    if (el.id === 'f-lang-en' || el.id === 'f-lang-pt') el.value = v || '';
    else el.value = v == null ? '' : String(v).replace(/<\/?strong>/g,'');
  });
}

function renderAll(){
  fillPanelScalars();
  renderSectionEditors();
  renderResume();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 600);
  setStatus('Unsaved changes…');
}
function saveLocal(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cv));
  setStatus('Saved · ' + new Date().toLocaleTimeString());
  toast('Saved to localStorage');
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}
function resetCV(){
  if (!confirm('Reset to factory default (includes CloudSec + ABZ suite projects)? This clears localStorage.')) return;
  localStorage.removeItem(STORAGE_KEY);
  cv = deepClone(DEFAULT_CV);
  renderAll();
  toast('Reset to default');
  setStatus('Reset');
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(cv, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cv_caio_correia.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('JSON exported');
}
function importJSON(ev){
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.name || !data.experience) throw new Error('Invalid CV JSON');
      cv = data;
      saveLocal();
      renderAll();
      toast('JSON imported');
    } catch(e){
      alert('Import failed: ' + e.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

async function exportPDF(){
  const msgs = {
    en: {
      gen: "Opening print dialog… Choose Save as PDF and turn off Headers and footers.",
      ok: "Print dialog opened",
      err: "Could not open print dialog"
    },
    pt: {
      gen: "Abrindo impressão… Escolha Salvar como PDF e desmarque Cabeçalhos e rodapés.",
      ok: "Diálogo de impressão aberto",
      err: "Não foi possível abrir a impressão"
    }
  };
  const m = msgs[lang] || msgs.en;
  const prevMode = mode;
  const body = document.body;
  const layout = document.getElementById("layout");

  mode = "preview";
  body.classList.remove("edit-mode");
  body.classList.add("pdf-exporting");
  layout.classList.add("preview-only");
  renderResume();
  toast(m.gen);
  setStatus(m.gen);

  try {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    window.print();
    toast(m.ok);
    setStatus(m.ok + " — preferível: Exportar_CV_PDF.bat (Chromium nativo)");
  } catch (e) {
    console.error(e);
    toast(m.err);
    setStatus(m.err + ": " + (e && e.message ? e.message : e));
  } finally {
    body.classList.remove("pdf-exporting");
    mode = prevMode;
    body.classList.toggle("edit-mode", prevMode === "edit");
    layout.classList.toggle("preview-only", prevMode === "preview");
    document.getElementById("btn-edit").classList.toggle("active", prevMode === "edit");
    document.getElementById("btn-preview").classList.toggle("active", prevMode === "preview");
    renderResume();
  }
}

function init(){
  cv = loadLocal() || deepClone(DEFAULT_CV);
  // ensure CloudSec + ABZ suite projects exist even on older localStorage (merge-by-key)
  function projectKey(p){
    const repo = (p.repo||'').toLowerCase();
    const live = (p.live||'').toLowerCase();
    const t = ((p.title&&p.title.en)||'').toLowerCase();
    if (repo.includes('cloudsec-finops-auditor') || live.includes('cloudsec-finops-auditor') || t.includes('cloudsec')) return 'cloudsec';
    if (repo.includes('employeehub') || live.includes('employee-hub') || t.includes('portal abz') || t.includes('employeehub')) return 'portal';
    if (repo.includes('pontoflow') || t.includes('pontoflow') || t.includes('timesheet manager')) return 'pontoflow';
    if (repo.includes('invoice_abz') || t.includes('invoice abz')) return 'invoice';
    if (t.includes('model context protocol') || t.includes('mcp')) return 'mcp';
    return repo || live || t || JSON.stringify(p.title||{});
  }
  const defProjects = deepClone(DEFAULT_CV.projects||[]);
  const existing = cv.projects||[];
  const byKey = new Map();
  existing.forEach(p => { byKey.set(projectKey(p), p); });
  // Prefer DEFAULT order: CloudSec, Portal, PontoFlow, Invoice, MCP; keep any extras after
  const ordered = [];
  const used = new Set();
  defProjects.forEach(dp => {
    const k = projectKey(dp);
    ordered.push(byKey.has(k) ? byKey.get(k) : dp);
    used.add(k);
  });
  existing.forEach(p => {
    const k = projectKey(p);
    if (!used.has(k)) { ordered.push(p); used.add(k); }
  });
  cv.projects = ordered;
  bindPanelInputs();
  renderAll();
  setStatus(localStorage.getItem(STORAGE_KEY) ? 'Loaded from localStorage' : 'Default CV loaded');
}
init();
